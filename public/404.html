<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>UniLab Inventory & Asset Manager</title>
    <script>
      // Single Page App redirect for GitHub Pages custom domains and subpaths
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirigiendo al sistema de inventario...</p>
  </body>
</html>
